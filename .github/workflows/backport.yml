name: Backport to LTS

# A merged pull request labelled "backport lts/2.0" (one label per line) gets a
# cherry-pick pull request against that branch (ee/docs/lts.md). Conflicts
# are reported on the original pull request for a maintainer to resolve.

on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    if: github.event.pull_request.merged == true && contains(join(github.event.pull_request.labels.*.name, ','), 'backport lts/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Open the backport pull requests
        uses: korthout/backport-action@v4
        with:
          label_pattern: '^backport (lts/[^ ]+)$'
