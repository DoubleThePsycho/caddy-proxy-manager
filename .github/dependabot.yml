version: 2
updates:
  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "fuomag9"
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Bun dependencies updates
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "fuomag9"
    labels:
      - "dependencies"
      - "bun"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group non-security updates
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # Security updates always get their own PR
    versioning-strategy: increase
    ignore:
      # Kept at the versions swagger-client pins, so the API reference loads one copy; update them with
      # swagger-ui-react when its swagger-client pins others (tests/unit/api-docs-refractors.test.ts fails then).
      - dependency-name: "@swagger-api/apidom-core"
      - dependency-name: "@swagger-api/apidom-ns-openapi-3-1"

  # Pinned Caddy, xcaddy, and plugin module updates
  - package-ecosystem: "gomod"
    directory: "/docker/caddy"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "fuomag9"
    labels:
      - "dependencies"
      - "caddy"
      - "security"
    commit-message:
      prefix: "caddy"
    groups:
      caddy-build:
        patterns:
          - "github.com/caddyserver/*"
          - "github.com/caddy-dns/*"
          - "github.com/mholt/caddy-l4"
          - "github.com/mholt/caddy-ratelimit"
          - "github.com/fuomag9/caddy-blocker-plugin"
          - "github.com/corazawaf/coraza-caddy/v2"
          - "github.com/google/cel-go"

  # Docker base images updates
  - package-ecosystem: "docker"
    directory: "/docker/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "fuomag9"
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "docker"

  - package-ecosystem: "docker"
    directory: "/docker/caddy"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "fuomag9"
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "docker"
